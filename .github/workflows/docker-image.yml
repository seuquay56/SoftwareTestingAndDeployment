name: Lab 10 - Test, Build and Publish Docker Image

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    name: Run .NET unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore solution
        run: dotnet restore SELab9_10.sln
      - name: Test BasicMath
        run: dotnet test Lab9/BasicMath.Tests/BasicMath.Tests.csproj --configuration Release --no-restore
      - name: Test BankAccount
        run: dotnet test Lab9/BankAccount.Tests/BankAccount.Tests.csproj --configuration Release --no-restore

  docker:
    name: Build Docker image and publish on main
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build image (and push on main)
        uses: docker/build-push-action@v6
        with:
          context: ./Lab10/DeploymentDemo
          file: ./Lab10/DeploymentDemo/Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ secrets.DOCKER_USERNAME != '' && format('{0}/selab-deployment-demo:latest', secrets.DOCKER_USERNAME) || 'local/selab-deployment-demo:latest' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
